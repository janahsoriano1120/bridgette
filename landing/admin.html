<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Bridgette Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--green:#5C7340;--green-dk:#4A5E34;--terra:#C4611A;--ink:#1A1C1E;--muted:#5f625c;--bg:#FAF8F4;--card:#fff;--line:#e4dfd3;--tint:#F1F4EC;--sand:#F3EDE1;--err:#B5451B}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "DM Sans",system-ui,sans-serif}
h1,h2,h3{font-family:Georgia,serif;margin:0}
button{font-family:inherit;cursor:pointer}
.hide{display:none!important}
/* login */
.loginwrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:22px}
.lcard{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:34px;max-width:400px;width:100%;box-shadow:0 10px 30px rgba(40,45,30,.06)}
.lcard img{height:34px;display:block;margin:0 0 22px}
.lcard h1{font-size:26px;color:var(--green);margin:0 0 6px}
.lcard p{color:var(--muted);margin:0 0 20px}
label{display:block;font-weight:700;font-size:14.5px;margin:0 0 6px}
input[type=email],input[type=password],input[type=search],select,textarea{width:100%;padding:12px 14px;font:16px "DM Sans",sans-serif;border:1px solid var(--line);border-radius:12px;background:#FDFCFA;color:var(--ink)}
.f{margin:0 0 16px}
.btn{background:var(--green);color:#fff;border:0;border-radius:100px;padding:13px 22px;font-weight:700;font-size:16px}
.btn:hover{background:var(--green-dk)}.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.full{width:100%}
.btn.ghost{background:#fff;color:var(--green);border:1.5px solid #C9D6B8}
.btn.warn{background:#fff;color:var(--err);border:1.5px solid #E8C4B4}
.btn.terra{background:var(--terra)}
.btn.sm{padding:8px 16px;font-size:14.5px}
.msg{color:var(--err);font-size:14.5px;min-height:20px;margin:10px 0 0}
/* app */
header{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.bar{max-width:1180px;margin:0 auto;padding:10px 22px;display:flex;align-items:center;gap:14px;justify-content:space-between}
.bar img{height:30px;display:block}
.tag{font-size:12.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--terra);margin-left:10px}
.who{font-size:14px;color:var(--muted);display:flex;gap:12px;align-items:center}
main{max-width:1180px;margin:0 auto;padding:26px 22px 80px}
.tabs{display:flex;gap:8px;margin:0 0 20px;flex-wrap:wrap}
.tab{background:#fff;border:1px solid var(--line);border-radius:100px;padding:9px 18px;font-weight:700;color:var(--muted);font-size:15px}
.tab.on{background:var(--green);color:#fff;border-color:var(--green)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:0 0 20px}
.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.stat b{display:block;font:700 28px Georgia,serif;color:var(--green)}
.stat span{font-size:13.5px;color:var(--muted)}
.stat.t b{color:var(--terra)}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 16px;align-items:center}
.tools input{flex:1;min-width:200px;max-width:340px}.tools select{width:auto}
.tools .sp{flex:1}
table{width:100%;border-collapse:separate;border-spacing:0;background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}
th{text-align:left;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:12px 14px;background:var(--sand);border-bottom:1px solid var(--line)}
td{padding:13px 14px;border-bottom:1px solid #EFEBDF;vertical-align:top;font-size:15px}
tr:last-child td{border-bottom:0}
tbody tr.row{cursor:pointer}tbody tr.row:hover{background:#FBFAF6}
.badge{display:inline-block;border-radius:100px;padding:3px 11px;font-size:12.5px;font-weight:700;white-space:nowrap}
.b-pending{background:#FBEFD9;color:#8A5A10}.b-approved{background:#E3ECD6;color:var(--green-dk)}.b-declined{background:#EFE9E4;color:#6b5f55}
.b-flag{background:#FBE4DA;color:var(--err)}.b-ok{background:var(--tint);color:var(--green)}
.sub{color:var(--muted);font-size:13.5px}
.empty{padding:40px;text-align:center;color:var(--muted);background:#fff;border:1px dashed var(--line);border-radius:16px}
/* drawer */
.ov{position:fixed;inset:0;background:rgba(26,28,30,.4);z-index:40}
.dr{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--bg);z-index:41;overflow:auto;box-shadow:-10px 0 40px rgba(0,0,0,.15)}
.dr .hd{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);padding:16px 22px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;z-index:2}
.dr .hd h2{font-size:22px;color:var(--green)}
.x{background:none;border:0;font-size:26px;line-height:1;color:var(--muted)}
.dr .bd{padding:18px 22px 40px}
.sec{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:0 0 14px}
.sec h3{font:700 12.5px "DM Sans",sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.kv{display:grid;grid-template-columns:150px 1fr;gap:4px 12px;font-size:15px}
.kv dt{color:var(--muted)}.kv dd{margin:0;overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{background:var(--tint);border:1px solid #DCE4D0;border-radius:100px;padding:2px 11px;font-size:14px}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 14px}
.note{margin:0 0 14px}.note textarea{min-height:80px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 20px;border-radius:100px;font-size:15px;z-index:60}
@media(max-width:760px){
  table,thead,tbody,tr,td{display:block}thead{display:none}
  table{background:none;border:0}
  tr.row{background:#fff;border:1px solid var(--line);border-radius:14px;margin:0 0 10px;padding:6px 4px}
  td{border:0;padding:4px 14px}
  .kv{grid-template-columns:1fr}.kv dt{margin-top:6px}
}
</style>
</head>

/* ---------- auth ---------- */
async function showApp(user){
  const {data,error}=await db.from('admins').select('user_id').eq('user_id',user.id).maybeSingle();
  if(error||!data){await db.auth.signOut();$('loginView').classList.remove('hide');$('appView').classList.add('hide');
    $('loginMsg').textContent='This account is not set up as an admin.';return;}
  $('whoEmail').textContent=user.email;
  $('loginView').classList.add('hide');$('appView').classList.remove('hide');
  startIdle();loadApps();loadWait();
}
$('loginForm').addEventListener('submit',async e=>{
  e.preventDefault();$('loginMsg').textContent='';
  if(!db){$('loginMsg').textContent='Cannot reach the server from this browser.';return;}
  $('loginBtn').disabled=true;
  const {data,error}=await db.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value});
  $('loginBtn').disabled=false;
  if(error){$('loginMsg').textContent='Wrong email or password.';return;}
  $('pw').value='';await showApp(data.user);
});
$('outBtn').addEventListener('click',signOut);
async function signOut(){clearTimeout(idleT);await db.auth.signOut();apps=[];wait=[];$('appsOut').innerHTML='';$('waitOut').innerHTML='';closeDrawer();
  $('appView').classList.add('hide');$('loginView').classList.remove('hide');}
function startIdle(){const r=()=>{clearTimeout(idleT);idleT=setTimeout(()=>{signOut();$('loginMsg').textContent='Signed out after 20 minutes without activity.';},IDLE_MS);};
  ['click','keydown','mousemove','touchstart'].forEach(ev=>document.addEventListener(ev,r,{passive:true}));r();}
(async()=>{if(!db)return;const {data}=await db.auth.getSession();if(data&&data.session)showApp(data.session.user);})();

/* ---------- tabs ---------- */
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===t));
  $('paneApps').classList.toggle('hide',t.dataset.tab!=='apps');$('paneWait').classList.toggle('hide',t.dataset.tab!=='wait');}));

/* ---------- applications ---------- */
async function loadApps(){
  const {data,error}=await db.from('founding_tester_consents').select('*');
  if(error){$('appsOut').innerHTML='<div class="empty">Could not load applications: '+esc(error.message)+'</div>';return;}
  apps=(data||[]).sort((a,b)=>new Date(dateOf(b)||0)-new Date(dateOf(a)||0));renderApps();
}
function renderStats(){
  const c={pending:0,approved:0,declined:0,leave:0};
  apps.forEach(r=>{c[statusOf(r)]=(c[statusOf(r)]||0)+1;if(r.if_not_selected&&r.if_not_selected!=='waitlist'&&statusOf(r)!=='approved')c.leave++;});
  $('stats').innerHTML=
   '<div class="stat t"><b>'+c.pending+'</b><span>Pending review</span></div>'+
   '<div class="stat"><b>'+c.approved+' / '+SLOTS+'</b><span>Approved slots</span></div>'+
   '<div class="stat"><b>'+c.declined+'</b><span>Declined (waitlist slot)</span></div>'+
   '<div class="stat"><b>'+c.leave+'</b><span>Asked to be removed</span></div>'+
   '<div class="stat"><b>'+apps.length+'</b><span>Total applications</span></div>';
}
function renderApps(){
  renderStats();
  const fs=$('fStatus').value,q=$('fSearch').value.trim().toLowerCase();
  const rows=apps.filter(r=>(fs==='all'||statusOf(r)===fs)&&(!q||[r.full_name,r.email,r.city].join(' ').toLowerCase().includes(q)));
  if(!rows.length){$('appsOut').innerHTML='<div class="empty">No applications here yet.</div>';return;}
  $('appsOut').innerHTML='<table><thead><tr><th>Applicant</th><th>Applied</th><th>Details</th><th>Status</th></tr></thead><tbody>'+
   rows.map((r,i)=>{
     const s=statusOf(r);
     const leave=r.if_not_selected&&r.if_not_selected!=='waitlist';
     const conds=Array.isArray(r.health_conditions)?r.health_conditions.filter(x=>x!=='None'&&x!=='Prefer not to say').length:0;
     return '<tr class="row" data-i="'+apps.indexOf(r)+'"><td><b>'+esc(r.full_name)+'</b><div class="sub">'+esc(r.email)+'</div></td>'+
      '<td>'+esc(fmtDate(dateOf(r)))+'</td>'+
      '<td class="sub">'+esc([r.city,r.phone_platform,r.lab_frequency].filter(Boolean).join(' | '))+(conds?'<div>'+conds+' condition'+(conds>1?'s':'')+' listed</div>':'')+'</td>'+
      '<td><span class="badge b-'+s+'">'+s+'</span>'+(leave&&s!=='approved'?' <span class="badge b-flag">wants removal</span>':'')+'</td></tr>';}).join('')+'</tbody></table>';
  document.querySelectorAll('#appsOut tr.row').forEach(tr=>tr.addEventListener('click',()=>openApp(+tr.dataset.i)));
}
['fStatus','fSearch'].forEach(id=>$(id).addEventListener('input',renderApps));
$('refreshA').addEventListener('click',loadApps);

const LABEL={full_name:'Name',email:'Email',mobile:'Mobile',date_of_birth:'Date of birth',city:'City or province',phone_platform:'Phone',phone_model:'Phone model',
 connectivity:'Internet',will_use_real_records:'Real records?',time_commitment:'Time they can give',lives_in_ph:'Lives in the Philippines',language:'Language',other_apps:'Apps used',
 heard_from:'Heard about us from',health_conditions:'Conditions',takes_medicines:'Regular medicines or supplements',lab_frequency:'Lab tests',specialists_seen:'Seen in the last 2 years',
 records_location:'Records live in',regular_doctor:'Regular doctor',lifestyle:'Lifestyle',tracks_already:'Already tracks',eating_pattern:'Eating',household_size:'Household users',
 works_abroad:'Family working abroad',caregiver_for_other:'Keeps records for someone else',motivation:'Why they applied',social_handle:'Social handle',preferred_channel:'Prefers to be reached on',
 if_not_selected:'If not picked'};
const IFNOT={waitlist:'Yes, waitlist slot with three months of Premium',signup_later:'No, will sign up later (remove application)',delete:'No, delete everything'};
function val(k,v){
  if(v==null||v==='')return '<span class="sub">not answered</span>';
  if(typeof v==='boolean')return v?'Yes':'No';
  if(Array.isArray(v))return v.length?'<div class="chips">'+v.map(x=>'<span class="chip">'+esc(x)+'</span>').join('')+'</div>':'<span class="sub">none ticked</span>';
  if(k==='if_not_selected')return esc(IFNOT[v]||v);
  if(k==='date_of_birth')return esc(fmtDate(v)+' (age '+Math.floor((Date.now()-new Date(v))/31557600000)+')');
  return esc(v);
}
function sec(title,keys,r){return '<div class="sec"><h3>'+title+'</h3><dl class="kv">'+keys.map(k=>'<dt>'+LABEL[k]+'</dt><dd>'+val(k,r[k])+'</dd>').join('')+'</dl></div>';}
function openApp(i){
  const r=apps[i];const s=statusOf(r);const leave=r.if_not_selected&&r.if_not_selected!=='waitlist';
  const consents=[['consent_health_data','Hold and process health data'],['consent_ai_processing','AI processing, including abroad'],['consent_terms_privacy','Read Privacy Notice and Terms'],['ack_beta','Understands beta'],['consent_feedback','Will give feedback'],['agree_founding_terms','Founding Tester terms'],['consent_quote','May quote feedback (optional)'],['consent_call_recording','May record calls (optional)'],['consent_marketing','Updates (optional)']];
  const html=
  '<div class="ov" id="ov"></div><aside class="dr" role="dialog" aria-label="Application"><div class="hd"><div><h2>'+esc(r.full_name)+'</h2><div class="sub">'+esc(r.email)+' | applied '+esc(fmtDate(dateOf(r)))+'</div></div><button class="x" id="xBtn" aria-label="Close">&times;</button></div><div class="bd">'+
  '<div class="acts">'+
   (s!=='approved'?'<button class="btn" data-act="approved">Approve</button>':'')+
   (s!=='declined'?'<button class="btn terra" data-act="declined">Decline (waitlist slot)</button>':'')+
   (s!=='pending'?'<button class="btn ghost" data-act="pending">Back to pending</button>':'')+
  '</div>'+
  (leave?'<div class="sec" style="border-color:#E8C4B4"><h3>Asked to be removed</h3><p style="margin:0 0 10px">They chose: '+esc(IFNOT[r.if_not_selected]||r.if_not_selected)+(s==='approved'?'. They are approved, so keep their application.':'. Delete the application once the 50 are chosen.')+'</p>'+(s!=='approved'?'<button class="btn warn sm" id="delBtn">Delete this application now</button>':'')+'</div>':'')+
  '<div class="note"><label for="nt">Your private note</label><textarea id="nt">'+esc(r.admin_note||'')+'</textarea><div style="margin-top:8px"><button class="btn ghost sm" id="saveNote">Save note</button></div></div>'+
  sec('Contact',['mobile','date_of_birth','city','preferred_channel','social_handle','language','lives_in_ph'],r)+
  sec('In their words',['motivation','heard_from'],r)+
  sec('Health',['health_conditions','takes_medicines','lab_frequency','specialists_seen','records_location','regular_doctor'],r)+
  sec('Day to day',['lifestyle','tracks_already','eating_pattern','household_size','works_abroad','caregiver_for_other'],r)+
  sec('Testing',['phone_platform','phone_model','connectivity','will_use_real_records','time_commitment','other_apps'],r)+
  sec('If not picked',['if_not_selected'],r)+
  '<div class="sec"><h3>Consents given</h3><dl class="kv">'+consents.map(c=>'<dt style="grid-column:1/-1;color:var(--ink)">'+(r[c[0]]?'&#10003; ':'&#10007; ')+esc(c[1])+'</dt>').join('')+'</dl><div class="sub" style="margin-top:8px">Form '+esc(r.consent_form_version||'')+' | Privacy Notice '+esc(r.privacy_notice_version||'')+' | Terms '+esc(r.terms_version||'')+'</div></div>'+
  '</div></aside>';
  $('drawerRoot').innerHTML=html;
  $('ov').addEventListener('click',closeDrawer);$('xBtn').addEventListener('click',closeDrawer);
  document.querySelectorAll('[data-act]').forEach(b=>b.addEventListener('click',()=>setStatus(r,b.dataset.act)));
  $('saveNote').addEventListener('click',()=>patch(r,{admin_note:$('nt').value.trim()||null},'Note saved'));
  if($('delBtn'))$('delBtn').addEventListener('click',()=>delApp(r));
}
function closeDrawer(){$('drawerRoot').innerHTML='';}
async function patch(r,fields,okMsg){
  const [k,v]=keyOf(r);
  const {error}=await db.from('founding_tester_consents').update(fields).eq(k,v);
  if(error){toast('Could not save: '+error.message);return false;}
  Object.assign(r,fields);toast(okMsg);renderApps();return true;
}
async function setStatus(r,s){
  if(s==='approved'){const n=apps.filter(x=>statusOf(x)==='approved').length;
    if(n>=SLOTS&&!confirm('You already have '+n+' approved. Approve this one too?'))return;}
  const ok=await patch(r,{status:s,reviewed_at:new Date().toISOString()},s==='approved'?'Approved':s==='declined'?'Declined':'Moved back to pending');
  if(ok)openApp(apps.indexOf(r));
}
async function delApp(r){
  if(!confirm('Permanently delete the application from '+r.full_name+'? This cannot be undone.'))return;
  const [k,v]=keyOf(r);
  const {error}=await db.from('founding_tester_consents').delete().eq(k,v);
  if(error){toast('Could not delete: '+error.message);return;}
  apps=apps.filter(x=>x!==r);closeDrawer();renderApps();toast('Application deleted');
}

/* ---------- waitlist ---------- */
async function loadWait(){
  const {data,error}=await db.from('waitlist').select('*');
  if(error){$('waitOut').innerHTML='<div class="empty">Could not load the waitlist: '+esc(error.message)+'</div>';return;}
  wait=(data||[]).sort((a,b)=>new Date(dateOf(b)||0)-new Date(dateOf(a)||0));renderWait();
}
function renderWait(){
  const pt=wait.filter(w=>w.role==='patient').length,pr=wait.filter(w=>w.role==='provider').length;
  const declined=apps.filter(a=>statusOf(a)==='declined'&&(!a.if_not_selected||a.if_not_selected==='waitlist')).length;
  $('wstats').innerHTML='<div class="stat"><b>'+wait.length+'</b><span>Landing page sign ups</span></div><div class="stat"><b>'+pt+'</b><span>Patients</span></div><div class="stat"><b>'+pr+'</b><span>Providers</span></div><div class="stat t"><b>'+declined+'</b><span>Declined testers with a reserved slot</span></div>';
  const q=$('wSearch').value.trim().toLowerCase();
  const rows=wait.filter(w=>!q||[w.name,w.email].join(' ').toLowerCase().includes(q));
  if(!rows.length){$('waitOut').innerHTML='<div class="empty">Nobody on the waitlist yet.</div>';return;}
  $('waitOut').innerHTML='<table><thead><tr><th>Name</th><th>Role</th><th>Joined</th><th></th></tr></thead><tbody>'+rows.map(w=>
   '<tr><td><b>'+esc(w.name)+'</b><div class="sub">'+esc(w.email)+'</div></td><td>'+esc(w.role||'')+(w.specialty?'<div class="sub">'+esc(w.specialty)+'</div>':'')+'</td><td>'+esc(fmtDate(dateOf(w)))+'</td><td>'+('id' in w?'<button class="btn warn sm" data-w="'+esc(w.id)+'">Remove</button>':'')+'</td></tr>').join('')+'</tbody></table>';
  document.querySelectorAll('[data-w]').forEach(b=>b.addEventListener('click',async()=>{
    const w=wait.find(x=>String(x.id)===b.dataset.w);if(!w||!confirm('Remove '+w.name+' from the waitlist?'))return;
    const {error}=await db.from('waitlist').delete().eq('id',w.id);
    if(error){toast('Could not remove: '+error.message);return;}wait=wait.filter(x=>x!==w);renderWait();toast('Removed');}));
}
$('wSearch').addEventListener('input',renderWait);$('refreshW').addEventListener('click',loadWait);

/* ---------- csv ---------- */
function csv(rows,name){
  if(!rows.length){toast('Nothing to export');return;}
  const cols=Array.from(rows.reduce((s,r)=>{Object.keys(r).forEach(k=>s.add(k));return s;},new Set()));
  const cell=v=>{if(v==null)return '';let s=Array.isArray(v)?v.join('; '):String(v);if(/^[=+\-@]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"';};
  const body=[cols.join(',')].concat(rows.map(r=>cols.map(c=>cell(r[c])).join(','))).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+body],{type:'text/csv'}));a.download=name+'-'+new Date().toISOString().slice(0,10)+'.csv';a.click();
}
$('csvA').addEventListener('click',()=>csv(apps,'founding-tester-applications'));
$('csvW').addEventListener('click',()=>csv(wait,'waitlist'));
</script>
