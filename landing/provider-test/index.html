.rxh{display:flex;align-items:center;gap:8px;margin-bottom:4px}.rxh b{font-size:14px;flex:1}.rxh small{font-size:12px;font-weight:700;border-radius:99px;padding:0 8px;background:rgba(0,0,0,.07)}
.rxic{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;color:#fff}.rxb.med .rxic{background:linear-gradient(135deg,#5C7340,#8AA867)}.rxb.sup .rxic{background:linear-gradient(135deg,#B8860B,#E0B94A)}.rxic svg{width:15px;height:15px;stroke:#fff}

.rxn b{display:block;font-size:15.5px}.rxn span{display:block;font-size:13.5px;color:#5b5c55}
.by{font-style:normal;font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;border:1.5px solid transparent;border-radius:99px;padding:2px 10px 2px 6px;background:linear-gradient(#fff,#fff) padding-box,linear-gradient(135deg,var(--c1),var(--c2)) border-box}.by i{width:9px;height:9px;border-radius:50%;background:linear-gradient(135deg,var(--c1),var(--c2))}
.vcs{display:flex;gap:8px;flex-wrap:wrap;padding:6px 16px}
.vc{display:inline-flex;gap:8px;align-items:baseline;background:#F6F4EF;border-radius:12px;padding:5px 12px;border-left:4px solid var(--c1)}.vc small{color:var(--mu);font-size:12.5px;font-weight:600}.vc b{font-size:14.5px}
.dnn{margin:8px 16px;padding:10px 14px;border-radius:12px;background:color-mix(in srgb,var(--c1) 6%,#fff);border-left:4px solid var(--c1);font-size:14.5px;line-height:1.55}.dnn.msg{background:#F6F4EF}.dnn.msg b{display:block;font-size:12.5px;color:var(--mu);margin-bottom:2px}
.dnfoot{display:flex;gap:8px;flex-wrap:wrap;padding:6px 16px 14px}.fc{display:inline-flex;gap:8px;align-items:baseline;border-radius:99px;padding:4px 14px;font-size:13.5px;background:linear-gradient(110deg,color-mix(in srgb,var(--c1) 14%,#fff),color-mix(in srgb,var(--c2) 22%,#fff))}.fc b{font-size:12.5px;color:var(--c1)}
.cw .top2>.pan,.cw .pan.gb{border:2px solid transparent;background:linear-gradient(#fff,#fff) padding-box,linear-gradient(135deg,#C4611A,#F2C08C) border-box;border-radius:20px}

@media(max-width:1000px){.dnh{flex-wrap:wrap;padding:10px 14px}.dnk{order:3}.dnt{flex-wrap:wrap}.dnb{margin-left:6px;padding-left:12px}.dnf button{font-size:13px}}

/* ===== doctors' notes v9 ===== */
.dnhead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}

.nkf button.on{background:#5C7340;color:#fff;box-shadow:0 2px 8px rgba(92,115,64,.3)}.nkf button.on small{background:rgba(255,255,255,.25)}

.nsf>span{font-size:13px;font-weight:600;color:var(--mu);margin-right:4px}
.nsf button{border:1.5px solid #DCD6C8;background:#fff;border-radius:999px;padding:5px 13px;font:600 13px inherit;font-family:inherit;color:#3c3d38;cursor:pointer}
.nsf button.on{border-color:#5C7340;background:#EEF3E6;color:#3F5229}
.dnl{margin-top:22px}
.dnk{font-size:13px;background:rgba(255,255,255,.22);border-radius:99px;padding:4px 12px;white-space:nowrap}
.dnb{padding-top:12px}
.dnc{border:1px solid #E6E1D6!important;background:#fff!important;box-shadow:none!important;border-radius:16px;margin-bottom:12px}

.dnday{display:flex;align-items:center;gap:8px;margin-top:3px;font-size:13.5px;color:var(--mu)}
.ago{font-style:normal;font-size:12px;font-weight:700;color:var(--c1);background:color-mix(in srgb,var(--c1) 10%,#fff);border-radius:99px;padding:1px 9px}

.dng.one{grid-template-columns:1fr}
.ncol{padding:6px 12px 8px;min-width:0}

.nch{display:flex;align-items:center;gap:7px;color:#6b6c64;margin-bottom:6px}.nch b{font-size:13px;color:#4a4b45}.nch small{font-size:11.5px;font-weight:700;background:#F1EEE6;border-radius:99px;padding:0 7px}
.ncol.nte .nch{color:var(--c1)}.ncol.rx .nch{color:#5C7340}.ncol.sp .nch{color:#A87A12}

.ncol li b{display:block;font-size:14px}.ncol li span{display:block;font-size:12.5px;color:#6b6c64}
.nn{margin:0;font-size:13px;color:#8a8b83}

.ncol .vcs,.ncol .dnfoot{padding:8px 0 0}
.vc{background:#F6F4EF;border-left:0;border-radius:8px;padding:3px 10px;box-shadow:inset 3px 0 0 var(--c1)}.vc b{font-size:13.5px}
.fc{background:#F6F4EF}.fc b{color:#4a4b45}
.rxic{background:none!important;color:#5C7340;width:auto;height:auto}.rxb.sup .rxic{color:#A87A12}.rxic svg{stroke:currentColor;width:16px;height:16px}

/* ===== doctors' notes v10 (Janah's layout) ===== */

.dnl.v10 .dnb{position:relative;margin-left:20px;padding:10px 0 0 22px}

.dnt2{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 16px 6px}

.dnt2 .dt{font-size:13px;color:var(--mu)}
.dnt2 .stp{font-size:11.5px;padding:2px 10px}
.dnc.v10 .ago{font-size:11.5px;background:#EFEBE2;color:#3c3d38}
.dnc.v10 .dng{padding:4px 0 10px}
.dnc.v10 .ncol{padding:6px 16px 8px}
.dnc.v10 .ncol+.ncol{border-left:1px solid #DDD7CB}
.dnc.v10 .ncol.nte .nch{color:#4a4b45}
.rxl{display:flex;flex-direction:column;gap:10px}
.rxe b{display:block;font-size:14px}
.ncol .rxe ul{list-style:disc;margin:2px 0 0;padding-left:16px;font-size:12.5px;color:#5b5c55;line-height:1.5}
.dnc.v10 .vc{box-shadow:none;background:#EFEBE2}.dnc.v10 .vc small{color:#6b6c64}
.dnc.v10 .fc{background:#EEF3E6}.dnc.v10 .fc b{color:#3F5229}
